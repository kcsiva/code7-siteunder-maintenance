
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 24px;
    }

    .logo {
      display: block;
      width: min(280px, 75vw);
      max-height: 280px;
      object-fit: contain;
      margin: 0 auto 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: 5px;
    }

    p {
      margin-top: 18px;
      color: #aab7ca;
      font-size: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="./logo.png" alt="Website logo" class="logo">
    <h1>SITE COMING SOON</h1>
    <p>Something exciting is on its way.</p>
  </main>
</body>
</html>
